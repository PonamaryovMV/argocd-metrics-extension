                            "metricName": "container",
                            "queryType": "instant",
                            "splitBy": "probe_type",
                            "warnAbove": 0
                          },
                          {
                            "name": "unit_last_reason",
                            "title": "Последнее завершение",
                            "graphType": "note",
                            "metricName": "container",
                            "queryType": "instant",
                            "splitBy": "reason",
                            "queryExpression": "max by (container, reason) (kube_pod_container_status_last_terminated_reason{namespace=\"{{.namespace}}\", pod=~\"{{.name}}\"}) > 0"
                          }
                        ]
                      },
                      {
                        "name": "resource_charts",
                        "title": "Ресурсы",
                        "graphs": [
                          {
                            "name": "cpu_chart",
                            "title": "CPU по контейнерам",
                            "graphType": "line",
                            "yAxisUnit": "cores",
                            "queryExpression": "sum by (container) (rate(container_cpu_usage_seconds_total{namespace=\"{{.namespace}}\", pod=~\"{{.name}}\", container!=\"\", container!=\"POD\"}[5m]))",
                            "metricName": "container",
                            "span": 6,
                            "thresholds": [
                              {
                                "key": "limit",
                                "name": "limit",
                                "queryExpression": "sum by (container) (kube_pod_container_resource_limits{namespace=\"{{.namespace}}\", pod=~\"{{.name}}\", resource=\"cpu\"})"
                              },
                              {
                                "key": "request",
                                "name": "request",
                                "queryExpression": "sum by (container) (kube_pod_container_resource_requests{namespace=\"{{.namespace}}\", pod=~\"{{.name}}\", resource=\"cpu\"})"
                              }
                            ]
                          },
                          {
                            "name": "memory_chart",
                            "title": "Память по контейнерам",
                            "graphType": "line",
                            "yAxisUnit": "bytes",
                            "queryExpression": "sum by (container) (container_memory_working_set_bytes{namespace=\"{{.namespace}}\", pod=~\"{{.name}}\", container!=\"\", container!=\"POD\"})",
                            "metricName": "container",
                            "span": 6,
                            "thresholds": [
                              {
                                "key": "limit",
                                "name": "limit",
                                "queryExpression": "sum by (container) (kube_pod_container_resource_limits{namespace=\"{{.namespace}}\", pod=~\"{{.name}}\", resource=\"memory\"})"
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ],
            "provider": {
              "Name": "default",
              "default": true,
              "address": "http://pr-kube-prometheus-stack-prometheus.mon.svc.cluster.local:9090"
            }
          }
        }
